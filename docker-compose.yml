version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: simanis-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simanis
    ports:
      - "5432:5432"
    volumes:
      - simanis_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  simanis_db_data:
